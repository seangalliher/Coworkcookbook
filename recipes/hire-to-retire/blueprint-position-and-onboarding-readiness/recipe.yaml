id: blueprint-position-and-onboarding-readiness
title: Open Position & Onboarding Readiness Blueprint
summary: >-
  Paste this recruit-and-onboard workflow blueprint into Cowork and it reports which positions are vacant, how long they have been open, and which new hires lack onboarding records.
business_value: >-
  Gives HR and the hiring managers one weekly view of where the pipeline is stalled, so long-vacant roles get escalated instead of quietly ageing.
plugin: dynamics-365-erp
process_tags:
  - hire-to-retire/recruit-and-onboard-talent
recipe_type: prompt+blueprint
difficulty: advanced
mutates_data: false
min_plugin_version: "1.0.0"
generated_by: copilot
reviewed_by: seangalliher
status: draft
deprecated: false
license: CC-BY-4.0
uses_skills:
  ootb:
    - Excel
    - Email
  plugin:
    - plugin: dynamics-365-erp
      action: data_find_entity_type
    - plugin: dynamics-365-erp
      action: data_find_entities_sql
  custom: []
blueprint:
  mermaid: blueprint.mmd
  image: blueprint.png
  source_node: hire-to-retire/recruit-and-onboard-talent
  inputs:
    - name: "legalEntity"
      value: "USMF"
      description: "Legal entity to scope every query to."
    - name: "asOfDate"
      value: "2017-12-31"
      description: "Reporting date. USMF HR data centres on FY2017."
    - name: "vacancyAgeDays"
      value: "90"
      description: "Days a position may stay open before it is flagged as stale."
prerequisites:
