    - Excel
    - Email
  plugin:
    - plugin: dynamics-365-erp
      action: data_find_entity_type
    - plugin: dynamics-365-erp
      action: data_find_entities_sql
  custom: []
blueprint:
  mermaid: blueprint.mmd
  image: blueprint.png
  source_node: record-to-report/close-financial-periods
  inputs:
    - name: "periodName"
      value: "2017-12"
      description: "Fiscal period to assess. USMF demo data is mostly FY2017."
    - name: "legalEntity"
      value: "USMF"
      description: "Legal entity to scope every query to."
    - name: "materialityThreshold"
      value: "10000"
      description: "Differences below this are listed but not flagged as blocking."
