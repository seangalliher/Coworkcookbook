id: blueprint-period-close-readiness
title: Period Close Readiness Blueprint
summary: >-
  Paste this period-close workflow blueprint into Cowork and it assesses whether the period is ready to close — unposted work, subledger-to-GL differences, and FX exposure.
business_value: >-
  Answers 'can we close?' on demand instead of on business day 5, so the controller chases the two subledgers that are actually blocking rather than polling every owner.
plugin: dynamics-365-erp
process_tags:
  - record-to-report/close-financial-periods
  - record-to-report/record-financial-transactions
recipe_type: prompt+blueprint
difficulty: advanced
mutates_data: false
min_plugin_version: "1.0.0"
generated_by: copilot
reviewed_by: seangalliher
status: draft
deprecated: false
license: CC-BY-4.0
uses_skills:
