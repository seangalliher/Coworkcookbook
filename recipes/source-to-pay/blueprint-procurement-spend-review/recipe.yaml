  custom: []
blueprint:
  mermaid: blueprint.mmd
  image: blueprint.png
  source_node: source-to-pay/analyze-procurement-and-sourcing
  inputs:
    - name: "legalEntity"
      value: "USMF"
      description: "Legal entity to scope every query to."
