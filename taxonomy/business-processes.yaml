  - id: source-to-pay/vendor-management
    title: Vendor Management
    level: area
    parent: source-to-pay
  - id: source-to-pay/invoice-capture-and-processing
    title: Invoice Capture and Processing
    level: area
    parent: source-to-pay
  - id: source-to-pay/invoice-validation
    title: Invoice Validation
    level: area
    parent: source-to-pay
  - id: source-to-pay/invoice-validation/three-way-match
    title: Three-way match
