version: "0.2.0"
source: "https://learn.microsoft.com/en-us/dynamics365/guidance/business-processes/overview"

nodes:
  # ===== End-to-end =====
  - id: record-to-report
    title: Record to Report
    description: Capture, classify, and report on financial transactions across the close cycle.
    level: end-to-end
  - id: source-to-pay
    title: Source to Pay
    description: Source vendors, procure goods/services, validate invoices, and execute payments.
    level: end-to-end
    bpmn: bpmn/source-to-pay.bpmn
  - id: order-to-cash
    title: Order to Cash
    description: Quote, sell, fulfil, invoice customers, and collect payment.
    level: end-to-end
  - id: plan-to-produce
    title: Plan to Produce
    description: Forecast demand, plan supply, and execute manufacturing.
    level: end-to-end
  - id: acquire-to-dispose
    title: Acquire to Dispose
    description: Acquire, manage, depreciate, and dispose of fixed assets.
    level: end-to-end
  - id: hire-to-retire
    title: Hire to Retire
    description: Workforce lifecycle from recruitment through separation.
    level: end-to-end
  - id: inventory-to-deliver
    title: Inventory to Deliver
    level: end-to-end
  - id: case-to-resolution
    title: Case to Resolution
    level: end-to-end
  - id: idea-to-market
    title: Idea to Market
    level: end-to-end

  # ===== Record to Report =====
  - id: record-to-report/general-ledger
    title: General Ledger
    level: area
    parent: record-to-report
  - id: record-to-report/period-close
    title: Period Close
    level: area
    parent: record-to-report
  - id: record-to-report/fx-revaluation
    title: FX Revaluation
    level: area
    parent: record-to-report
  - id: record-to-report/journal-validation
    title: Journal Validation
    level: area
    parent: record-to-report

