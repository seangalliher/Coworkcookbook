    parent: source-to-pay/invoice-validation
  - id: source-to-pay/payment-execution
    title: Payment Execution
    level: area
    parent: source-to-pay
  - id: source-to-pay/payment-execution/payment-proposal-review
    title: Payment proposal review
    level: activity
