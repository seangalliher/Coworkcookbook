version: "0.1.0"
source: "https://learn.microsoft.com/en-us/dynamics365/guidance/business-processes/overview"

# Microsoft Business Process Catalog — initial hierarchy.
# v1 fully models only `source-to-pay` with a BPMN file; other end-to-end areas are
# top-level placeholders to be expanded by maintainers via PR (see P-020).

nodes:
  # ===== End-to-end processes =====
  - id: record-to-report
    title: Record to Report
    description: Capture, classify, and report on financial transactions across the close cycle.
    level: end-to-end

  - id: source-to-pay
    title: Source to Pay
    description: Source vendors, procure goods/services, validate invoices, and execute payments.
    level: end-to-end
    bpmn: bpmn/source-to-pay.bpmn

  - id: order-to-cash
    title: Order to Cash
    description: Quote, sell, fulfil, invoice customers, and collect payment.
    level: end-to-end

  - id: plan-to-produce
    title: Plan to Produce
    description: Forecast demand, plan supply, and execute manufacturing.
    level: end-to-end

  - id: acquire-to-dispose
    title: Acquire to Dispose
    description: Acquire, manage, depreciate, and dispose of fixed assets.
    level: end-to-end

  - id: hire-to-retire
    title: Hire to Retire
    description: Workforce lifecycle from recruitment through separation.
    level: end-to-end

  - id: inventory-to-deliver
    title: Inventory to Deliver
    description: Manage inventory, warehousing, and outbound logistics.
    level: end-to-end

  - id: case-to-resolution
    title: Case to Resolution
    description: Capture, route, and resolve customer service cases.
    level: end-to-end

  - id: idea-to-market
    title: Idea to Market
    description: From product concept through launch.
    level: end-to-end

  # ===== Source-to-Pay process areas =====
  - id: source-to-pay/vendor-management
    title: Vendor Management
    description: Onboard, maintain, and offboard vendors.
    level: area
    parent: source-to-pay

  - id: source-to-pay/invoice-capture-and-processing
    title: Invoice Capture and Processing
    description: Receive and capture vendor invoices into the system.
    level: area
    parent: source-to-pay

  - id: source-to-pay/invoice-validation
    title: Invoice Validation
    description: Validate invoices against POs and policy before posting.
    level: area
    parent: source-to-pay

  - id: source-to-pay/payment-execution
    title: Payment Execution
    description: Propose, approve, and execute payments to vendors.
    level: area
    parent: source-to-pay

  # ===== Source-to-Pay sample activities =====
  - id: source-to-pay/invoice-validation/three-way-match
    title: Three-way match
    description: Match invoice to PO and goods receipt before approval.
    level: activity
    parent: source-to-pay/invoice-validation

  - id: source-to-pay/payment-execution/payment-proposal-review
    title: Payment proposal review
    description: Review the payment proposal for accuracy before release.
    level: activity
    parent: source-to-pay/payment-execution
