name: validate
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  schema-and-content:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install validation deps
        run: pip install --quiet jsonschema pyyaml yamllint lxml

      - name: yamllint taxonomy/
        run: yamllint -c .yamllint.yml taxonomy/

      - name: Validate every recipe.yaml + taxonomy + skills
        run: python .github/scripts/validate_recipes.py

      - name: BPMN well-formed XML check
        run: |
          for f in taxonomy/bpmn/*.bpmn; do
            python -c "from lxml import etree; etree.parse('$f')" || exit 1
          done

      - name: Cowork skill format check
        run: python .github/scripts/validate_skills.py

  links-and-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Markdown image alt-text check
        run: |
          # Fails if any recipes/**/*.md contains an image ref ![](path) with empty alt text.
          set -e
          found=0
          while IFS= read -r f; do
            if grep -Pn '!\[\s*\]\([^)]+\)' "$f"; then
              echo "::error file=$f::image without alt text"
              found=1
            fi
          done < <(find recipes -name '*.md' -type f)
          exit $found

      - name: Link check
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v1.10.0
        with:
          args: --no-progress --offline --include-fragments './**/*.md'
        continue-on-error: false
